openapi: 3.1.0
info:
  title: skill-opinion-to-ruler
  description: Extract testable trading rules from subjective market opinions. Maps free-form text into instrument, direction, entry trigger, horizon, stop loss and exit rule; validates extraction against a human-labelled sample; evaluates cost-adjusted results against a paired buy-and-hold baseline.
  version: 0.7.1

x-skill-info:
  name: skill-opinion-to-ruler
  type: alpha
  category: opinion-rule-extraction
  entry: scripts/build.py
  tags: [quant, alpha, opinion, rule-extraction, backtest, futures]

x-steps:
  - id: extract
    script: scripts/build.py
    description: Run the built-in demo that extracts rules from a mixed opinion paragraph.
    auth_required: false
  - id: annotate
    script: scripts/annotate.py
    description: Score extraction against a human-labelled JSON sample, per field.
    auth_required: false
  - id: landing
    script: scripts/mcp_landing.py
    description: Convert agent-landed verbatim MCP payloads into this skill's own CSV files (--build / --verify / --inspect). Reads files only; never fetches.
    auth_required: false
  - id: evaluate
    script: scripts/evaluate.py
    description: End-to-end extraction, label scoring, paired-baseline backtest and verdict. Pass --check-baseline baselines/frozen_baseline.json to verify the run against the shipped frozen anchor in the same command (read-only; non-zero exit on any changed field).
    auth_required: false
  - id: anchor_check
    script: scripts/compare_baseline.py
    description: Read-only acceptance guard. Re-runs the deterministic bundled fixtures and compares every field against the shipped anchor baselines/frozen_baseline.json plus baselines/scope_declaration.json; names each field that moved (frozen -> new) and exits 1. Reads files only; never fetches.
    auth_required: false

x-preflight:
  # Mirror of the "## 前置检查" section in SKILL.md: host-provided data and model,
  # stop at the first failing item, report only what is missing.
  host: QuantStudio
  stop_on_failure: true
  items:
    - id: mcp_session
      check: "mcp__pandadata__auth_status -> ok: true and reauth_required: false"
    - id: permission_probe
      check: "one minimal get_trade_cal call; data_permission_required means stop"
    - id: model
      check: "supplied by the host; this skill holds no endpoint and no key"
    - id: interpreter
      check: "scripts are standard-library only; tests need `import pytest`"

x-acceptance-anchor:
  reference: baselines/frozen_baseline.json
  reference_scope: baselines/scope_declaration.json
  shipped_in_package: true
  regenerated_products: output/            # git-ignored landing spot, not an authority
  guard: tests/test_baseline_guard.py
  tolerance: 5e-07                          # half a unit of the report's 6-dp rounding
  waived_fields: [generated_at]

x-data-sources:
  - id: pandadata_mcp_landing
    methods: [get_future_daily, get_future_dominant]
    transport: >-
      MCP tools are callable only by an agent. The agent calls
      mcp__pandadata__call_pandadata, writes the returned payload verbatim under
      tests/fixtures/raw/, and scripts/mcp_landing.py --build converts it. Scripts hold no
      network access and no credentials.
    landed_payload: tests/fixtures/raw/<method>__<label>.json
    built_path: tests/fixtures/landed/bars_<SYMBOL>.csv
    dominant_path: tests/fixtures/landed/dominant_<PRODUCT>.csv
    provenance: tests/fixtures/landed/provenance.json
    truncation_guard: parquet preview capped at 2000 rows; truncated / row_count < total_rows is refused by --build unless --allow-partial
    auth_env: []          # scripts hold no credentials; login lives in Settings -> PandaData
  - id: csv
    description: Local bars with date,open,high,low,close[,volume] header.

x-input-schema:
  type: object
  properties:
    documents:
      type: array
      items:
        type: object
        required: [text]
        properties:
          id: {type: string}
          source: {type: string}
          published_at: {type: string, description: "ISO-8601; required for backtesting"}
          text: {type: string, description: "The opinion text, verbatim"}

x-output-fields:
  [schema_version, extractor_version, documents, summary, config, config_hash]

# Every key the extractor emits on a rule object, no more and no fewer.
# A consumer contract that under-declares is how percent_levels -- the channel
# that says "the author meant 3%, not price 3" -- stays invisible downstream.
x-rule-fields:
  [rule_id, schema_version, source_text, source_document_text, published_at, source,
   instrument, instrument_inherited, direction, direction_word, direction_inferred,
   entry_trigger, horizon, horizon_inherited, stop_loss, exit_rule, position_size,
   invalidation, percent_levels, ambiguity, assumed, missing_fields, testability, reason]

x-testability-enum: [full, partial, neutral, none]

x-requirements:
  runtime: python >= 3.8
  packages: []
  optional_packages: []   # 0.4.0: legacy fetch channel removed; data arrives as agent-landed MCP payloads

x-boundaries:
  - Daily-close mechanics only; no intraday triggers or limit-locked fills.
  - Cross-rule capital competition is not modelled.
  - Research and educational use only; not investment advice.